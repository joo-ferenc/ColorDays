<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F4">
<meta name="description" content="ColorDays – Mal-Kalender und Jahresplaner gestalten und drucken">
<title>ColorDays – Mein kreativer Kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Patrick+Hand&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#FBF8F4;--surface:#fff;--ink:#2B2D42;--muted:#5C5F73;--line:#DDD8D2;--blue:#3D5A80;--pblue:#CFE3F5;--green:#3C7A57;--pgreen:#D5EDDC;--peach:#B8613A;--ppeach:#FCE1CF;--lilac:#6B5B95;--plilac:#E4DCF2;--danger:#B3261E;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.ic{display:block;flex:none}
#app{max-width:1200px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg)}
.bar-pad{width:4px}
.bar-title{flex:1;min-width:0}
.bar h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-home .bar h1,.bar h1:only-child{}
.bar-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;gap:4px;align-items:center}
.screen{padding:4px 16px 24px}
.icon-btn{width:48px;height:48px;display:inline-grid;place-items:center;border-radius:50%;color:var(--ink)}
.icon-btn:hover{background:rgba(61,90,128,.08)}
.icon-btn.tonal{background:var(--pblue)}
.icon-btn.light{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.tonal{background:var(--pgreen);color:var(--ink)}
.btn.text{color:var(--blue);padding:10px 12px}
.btn.danger{background:var(--danger);color:#fff}
.danger-text{color:var(--danger)!important}
.btn.wide{width:100%;margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:16px}
.row.between{justify-content:space-between}
.grow{flex:1}.text-left{text-align:left}.center{text-align:center;margin:16px 0}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.label{font-weight:700;margin:14px 0 6px}
.foot-note{color:var(--muted);font-size:14px;text-align:center;margin-top:24px}
/* Start */
.home-grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:8px}
@media(min-width:640px){.home-grid{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:24px;min-height:96px}
.choice.big{min-height:150px}
.choice b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.choice.big b{font-size:24px}
.choice small{display:block;color:var(--muted);font-size:14px}
.choice-ic{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center}
.blue{background:var(--pblue)}.green{background:var(--pgreen)}.peach{background:var(--ppeach)}.lilac{background:var(--plilac)}
/* Formulare */
.form{max-width:640px;margin:0 auto}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea,.form select{width:100%;min-height:52px;padding:12px 14px;border:1px solid #B8B3AD;border-radius:12px;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.field.err input{border-color:var(--danger)}.field em{color:var(--danger);font-style:normal;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{min-height:40px;padding:6px 16px;border:1px solid #B8B3AD;border-radius:10px;background:#fff}
.chip.on{background:var(--pblue);border-color:var(--blue);font-weight:700}
.check{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.year{display:flex;align-items:center;gap:12px}
.year input{width:130px;min-height:52px;text-align:center;font-size:24px;font-weight:700;border:1px solid #B8B3AD;border-radius:12px;background:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sw{width:36px;height:36px;border-radius:50%;border:1px solid #B8B3AD}
.sw.on{border:3px solid var(--blue);box-shadow:inset 0 0 0 2px #fff}
/* Liste */
.list{display:grid;gap:12px;max-width:720px;margin:0 auto}
.item{display:flex;align-items:center;border-radius:var(--r);padding-right:4px}
.item-main{flex:1;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;min-width:0}
.item-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:16px;min-height:56px;padding:0 8px;text-align:left;border-radius:12px}
.menu button:hover{background:rgba(61,90,128,.06)}.menu .ic{color:var(--blue)}
/* Vorlagen */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.tab{flex:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--blue);border-color:var(--blue)}
.grid-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.grid-headers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-size:13px}
.tcard.on{border:3px solid var(--blue);padding:4px}
.thumb-svg{width:100%;display:block;background:#fff}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icon-choice{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:#fff}
.icon-choice.on{border:3px solid var(--blue)}
/* Übersicht */
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mcard{background:#fff;border-radius:var(--r);padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mcard-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mcard-head b{display:block}.mcard-head small{color:var(--muted);font-size:12px}
.page-thumb{display:block;width:100%;border:1px solid var(--line);background:#fff;padding:0;line-height:0}
.page-thumb svg{width:100%;height:auto;display:block}
.page-thumb.big{max-width:560px;margin:0 auto}
/* Seitenbühne mit Zoom */
.page-stage{position:relative;overflow:hidden;background:#EFEAE4;border-radius:12px;height:calc(100vh - 170px);min-height:360px;display:grid;place-items:center}
.page-stage.fit{height:auto;min-height:0;max-height:calc(100vh - 150px);max-width:100%;margin:0 auto}
.page-inner{width:100%;height:100%;display:grid;place-items:center;transform-origin:center;padding:8px}
.page-inner svg{max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);cursor:pointer}
.page-stage.zoomed{cursor:grab}
.zoom-tools{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.planner{display:grid;gap:16px}
@media(min-width:900px){.planner{grid-template-columns:1fr 340px;align-items:start}}
.panel{background:#fff;border-radius:var(--r);padding:12px 16px}
/* Export */
.export{max-width:760px;margin:0 auto}
.info{margin:4px 0}
.previews{display:grid;gap:16px;margin-top:10px}
figure{margin:0;text-align:center}figcaption{color:var(--muted);font-size:14px;margin-top:4px}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#F1F0F3;box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.bottom-bar .btn{flex:1;max-width:200px;padding:10px 8px;min-width:0}
@media(max-width:420px){.hide-xs{display:none}}
/* Editor */
.editor .chips{margin-top:0}
.ed-stage{background:#E9E5E0;border-radius:12px;padding:8px;display:grid;place-items:center}
#ed{width:100%;max-height:calc(100vh - 380px);min-height:240px;touch-action:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.selbar{display:flex;overflow-x:auto;min-height:0;background:#fff;border-radius:12px;margin-top:6px}
.selbar:empty{display:none}
.ed-tools{display:flex;overflow-x:auto;gap:2px;margin-top:6px;padding-bottom:4px}
.tool{flex:none;width:66px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font-size:11px;cursor:pointer}
.tool.on{background:var(--pblue)}
.ed-size{flex-wrap:nowrap}.ed-size input{flex:1}
.layer{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);min-height:48px}
.layer button.grow{padding:8px;min-height:44px}.layer.on button.grow{font-weight:700}
/* Dialoge */
.modal-wrap{position:fixed;inset:0;z-index:20;background:rgba(43,45,66,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:24px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal h2{margin:0 0 8px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px}
.modal-wrap.sheet{place-items:end center;padding:0}
.modal-wrap.sheet .modal{border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-wrap.full{padding:0}
.modal-wrap.full .modal{width:100%;height:100%;max-height:none;border-radius:0;padding:0;display:flex;flex-direction:column;background:var(--bg)}
.modal-head{display:flex;align-items:center;gap:8px;padding:8px 12px}.modal-head h2{flex:1;margin:0}
.modal-body{flex:1;overflow:auto;padding:8px 16px 24px}
.modal-wrap.full .tabs{padding:0 12px}
.modal-wrap.dark .modal{background:#2B2D42;color:#fff}
.zoom-top{display:flex;align-items:center;gap:4px;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}#zt{flex:1;font-weight:700}
.zoom-view{flex:1;overflow:hidden;position:relative}
.zoom-inner{width:100%;height:100%;display:grid;place-items:center;transform-origin:center}
.zoom-inner svg{max-width:96%;max-height:96%;width:auto;height:auto;background:#fff}
.zoom-nav{display:flex;justify-content:center;gap:24px;padding:12px calc(12px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:.25s;z-index:40;background:#2B2D42;color:#fff;padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:50;background:rgba(251,248,244,.85);display:grid;place-content:center;justify-items:center;gap:12px;font-weight:700}
.spinner{width:40px;height:40px;border:4px solid var(--pblue);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  .print-page{page-break-after:always;break-after:page;overflow:hidden}
  .print-page svg{width:100%;height:100%;display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.lang-row{display:flex;justify-content:center;margin-top:20px}
</style>
</head>

/* ---------- Speicher: claude.ai-Datenbank (pro Person, privat) oder localStorage ---------- */
const Store = {
  mode: 'memory', db: null, col: null, projects: new Map(), drawings: new Map(), images: new Map(),
  queues: new Map(), timers: new Map(), error: null,

  async init() {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const timeout = new Promise(r => setTimeout(() => r(null), 10000));
        const [user, db] = await Promise.all([Promise.race([claude.use('user'), timeout]), Promise.race([claude.use('db'), timeout])]);
        const id = user ? await user.id() : null;
        if (db && id) {
          this.db = db; this.col = db.collection('data/users/' + id); this.mode = 'db';
          const snap = await this.col.where('kind', '==', 'project').get();
          snap.docs.forEach(d => { const p = d.data().p; if (p) this.projects.set(p.id, structuredClone(p)); });
          return;
        }
      } catch (e) { console.warn('db nicht verfügbar', e); }
    }
    try {
      localStorage.setItem('cd.test', '1'); localStorage.removeItem('cd.test');
      this.mode = 'local';
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('cd.p.')) { try { const p = JSON.parse(localStorage.getItem(k)); this.projects.set(p.id, p); } catch (_) {} }
      }
    } catch (_) { this.mode = 'memory'; }
  },

  /** Schreibt nacheinander pro Dokument (eine Schreiboperation zur Zeit). */
  _write(key, body) {
    const prev = this.queues.get(key) || Promise.resolve();
    const next = prev.then(async () => {
      try {
        if (this.mode === 'db') {
          if (body === null) await this.col.doc(key).delete(); else await this.col.doc(key).set(body);
        } else if (this.mode === 'local') {
          const lk = 'cd.' + key.replace('_', '.');
          if (body === null) localStorage.removeItem(lk); else localStorage.setItem(lk, JSON.stringify(body.p || body.d || body.i));
        }
        this.error = null;
      } catch (e) {
        console.error('Speichern fehlgeschlagen', e);
        this.error = (e && (e.code === 'quota_exceeded' || e.name === 'QuotaExceededError')) ? t('Der Speicher ist voll.') : t('Speichern fehlgeschlagen.');
        UI && UI.toast && UI.toast(this.error);
      }
    });
    this.queues.set(key, next);
    return next;
  },
  /** Bündelt schnelle Änderungen zu einer Schreiboperation. */
  _debounced(key, fn, ms = 400) {
    clearTimeout(this.timers.get(key));
    this.timers.set(key, setTimeout(() => { this.timers.delete(key); fn(); }, ms));
  },
  async flush() {
    for (const [k, t] of this.timers) { clearTimeout(t); }
    const pending = [...this.timers.keys()]; this.timers.clear();
    for (const k of pending) {
      const [kind, id] = k.split('_');
      if (kind === 'p' && this.projects.has(id)) this._write(k, { kind: 'project', p: this.projects.get(id) });
      if (kind === 'd' && this.drawings.has(id)) this._write(k, { kind: 'drawing', d: this.drawings.get(id) });
    }
    await Promise.all([...this.queues.values()]);
  },

  list() { return [...this.projects.values()].sort((a, b) => b.updatedAt - a.updatedAt); },
  get(id) { return this.projects.get(id); },
  saveProject(p, immediate = false) {
    p.updatedAt = Date.now();
    this.projects.set(p.id, p);
    const key = 'p_' + p.id;
    const run = () => this._write(key, { kind: 'project', p });
    if (immediate) { clearTimeout(this.timers.get(key)); this.timers.delete(key); return run(); }
    this._debounced(key, run);
  },
  async deleteProject(p) {
    const drawings = new Set();
    Object.values(p.days).forEach(d => d.drawingId && drawings.add(d.drawingId));
    Object.values(p.months).forEach(m => m.customHeader && drawings.add(m.customHeader));
    for (const id of drawings) await this.deleteDrawing(id);
    if (p.options.headerImage) this._write('i_' + p.options.headerImage, null);
    this.projects.delete(p.id);
    await this._write('p_' + p.id, null);
  },

  async getDrawing(id) {
    if (this.drawings.has(id)) return this.drawings.get(id);
    let d = null;
    try {
      if (this.mode === 'db') { const s = await this.col.doc('d_' + id).get(); d = s.exists ? structuredClone(s.data().d) : null; }
      else if (this.mode === 'local') { const raw = localStorage.getItem('cd.d.' + id); d = raw ? JSON.parse(raw) : null; }
    } catch (e) { console.warn(e); }
    if (d) { this.drawings.set(id, d); await this.ensureImages(drawingImageIds(d)); }
    return d;
  },
  saveDrawing(d, immediate = false) {
    this.drawings.set(d.id, d);
    const key = 'd_' + d.id, run = () => this._write(key, { kind: 'drawing', d });
    if (immediate) return run();
    this._debounced(key, run, 600);
  },
  async deleteDrawing(id) {
    const d = await this.getDrawing(id);
    if (d) for (const img of drawingImageIds(d)) this._write('i_' + img, null);
    this.drawings.delete(id);
    await this._write('d_' + id, null);
  },
  async copyDrawing(id) {
    const d = await this.getDrawing(id); if (!d) return null;
    const c = structuredClone(d); c.id = uid();
    for (const el of c.elements) if (el.props.img) el.props.img = await this.saveImage(this.images.get(el.props.img));
    this.saveDrawing(c, true);
    return c.id;
  },

  async saveImage(dataUrl) {
    if (!dataUrl) return null;
    const id = uid();
    this.images.set(id, dataUrl);
    await this._write('i_' + id, { kind: 'image', i: dataUrl });
    return id;
  },
  async ensureImages(ids) {
    for (const id of ids) {
      if (!id || this.images.has(id)) continue;
      try {
        if (this.mode === 'db') { const s = await this.col.doc('i_' + id).get(); if (s.exists) this.images.set(id, s.data().i); }
        else if (this.mode === 'local') { const v = localStorage.getItem('cd.i.' + id); if (v) this.images.set(id, JSON.parse(v)); }
      } catch (e) { console.warn(e); }
    }
  },
  /** Lädt alles, was zum Rendern eines Projekts nötig ist (eigene Zeichnungen, Bilder). */
  async preload(p) {
    const ids = new Set();
    Object.values(p.days).forEach(d => d.drawingId && ids.add(d.drawingId));
    Object.values(p.months).forEach(m => m.customHeader && ids.add(m.customHeader));
    for (const id of ids) await this.getDrawing(id);
    await this.ensureImages([p.options.headerImage]);
  },
};
const drawingImageIds = d => d.elements.filter(e => e.type === 'IMAGE' && e.props.img).map(e => e.props.img);

/** Bild verkleinern (max. 1200 px) und als JPEG/PNG-Data-URL < 240 KB liefern. */
function downscaleImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let max = 1200, q = 0.85, out = null, w = 0, h = 0;
      const png = file.type === 'image/png';
      for (let attempt = 0; attempt < 6; attempt++) {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        w = Math.round(img.width * s); h = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d');
        if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); }
        g.drawImage(img, 0, 0, w, h);
        out = png && attempt < 2 ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
        if (out.length < 240000) break;
        max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.07);
      }
      resolve({ dataUrl: out, w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht geladen werden')); };
    img.src = url;
  });
}

  wrap(text, size, family, bold, maxW) {

/** Schriftauswahl je Ziel: im PDF Helvetica (eingebettet), am Bildschirm die Webschriften. */

/* ---------- Motive ---------- */

    p[0] === 'o' ? `<circle cx="${p[1]}" cy="${p[2]}" r="${p[3]}"/>` :
      `<ellipse cx="${(p[1] + p[3]) / 2}" cy="${(p[2] + p[4]) / 2}" rx="${(p[3] - p[1]) / 2}" ry="${(p[4] - p[2]) / 2}"/>`).join('');

}
/** Motiv quadratisch und zentriert in ein Rechteck einpassen. */
function motifIn(name, x, y, w, h, sw, color) {
  const s = Math.min(w, h);
  return motifSVG(name, x + (w - s) / 2, y + (h - s) / 2, s, sw, color);
}

/* ---------- Katalogvorlagen ---------- */
function templateDrawingSVG(id, x, y, w, h) {
  const t = Catalog.byId[id]; if (!t) return '';
  const side = Math.min(w, h), sx = x + (w - side) / 2, sy = y + (h - side) / 2;
  const ins = f => motifSVG(t.motif, sx + side * f, sy + side * f, side * (1 - 2 * f));
  const stroke = sw => `fill="none" stroke="#000" stroke-width="${f1(sw)}" stroke-linecap="round"`;
  switch (t.variant) {
    case 1: {
      const sp = (cx, cy, r) => `<path ${stroke(r * 0.3)} d="M${f1(cx - r)} ${f1(cy)}H${f1(cx + r)}M${f1(cx)} ${f1(cy - r)}V${f1(cy + r)}"/>`;
      return ins(0.12) + sp(sx + side * 0.1, sy + side * 0.12, side * 0.07) + sp(sx + side * 0.9, sy + side * 0.2, side * 0.05) + sp(sx + side * 0.86, sy + side * 0.9, side * 0.06);
    }
    case 2: {
      let d = `M${f1(sx + side * 0.04)} ${f1(sy + side * 0.88)}`;
      for (let px = sx + side * 0.04; px < sx + side * 0.92; px += side * 0.12) d += ` Q${f1(px + side * 0.06)} ${f1(sy + side * 0.82)} ${f1(px + side * 0.12)} ${f1(sy + side * 0.88)}`;
      const s2 = side * 0.8;
      return motifSVG(t.motif, sx + (side - s2) / 2, sy, s2) + `<path ${stroke(side * 0.025)} d="${d}"/>`;
    }
    case 3:

    default: return ins(0.04);

}
/** Kopfzeile: Mitte bleibt frei für den Titel (separate Textebene). */
function headerSVG(id, x, y, w, h) {
  const hd = Catalog.headerById[id]; if (!hd) return '';
  const size = h * 0.82, gap = size * 0.08, cy = y + h / 2;
  const pos = [x + size / 2, x + size * 1.5 + gap, x + w - size * 1.5 - gap, x + w - size / 2];
  let out = hd.motifs.slice(0, 4).map((m, i) => { const s = (i === 1 || i === 2) ? size * 0.72 : size; return motifSVG(m, pos[i] - s / 2, cy - s / 2, s, 3.0); }).join('');
  const left = pos[1] + size * 0.5, right = pos[2] - size * 0.5;

/* ColorDays Web – PDF-Erzeugung, Speichern, Drucken, Teilen. */

const PdfLibs = {
  promise: null,
  load() {
    if (this.promise) return this.promise;
    const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    this.promise = load('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')
      .then(() => load('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js'))
      .then(() => !!(window.jspdf && window.jspdf.jsPDF))
      .catch(() => false);
    return this.promise;
  },
};

function pagesFor(p, months) {
  if (p.type === 'YEAR_PLANNER') return [opts => plannerSVG(p, opts)];
  return months.slice().sort((a, b) => a - b).map(m => opts => monthPageSVG(p, m, opts));
}

/** PDF direkt aus dem Datenmodell. Vektor (jsPDF + svg2pdf) wenn verfügbar, sonst Rasterbild 200 dpi. */
async function buildPdf(p, months, onProgress) {
  await Store.preload(p);
  const pages = pagesFor(p, months);
  if (await PdfLibs.load()) {
    try { return { blob: await vectorPdf(pages, onProgress), vector: true }; } catch (e) { console.warn('Vektor-PDF fehlgeschlagen, Raster-Fallback', e); }
  }
  return { blob: await rasterPdf(pages, onProgress), vector: false };
}

async function vectorPdf(pages, onProgress) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden';
  document.body.appendChild(holder);
  try {
    for (let i = 0; i < pages.length; i++) {
      const { svg, W, H } = pages[i]({ pdf: true });
      const orient = W > H ? 'l' : 'p';
      if (!doc) doc = new jsPDF({ orientation: orient, unit: 'pt', format: [W, H], compress: true });
      else doc.addPage([W, H], orient);
      holder.innerHTML = svg;
      const el = holder.firstElementChild;
      if (typeof doc.svg === 'function') await doc.svg(el, { x: 0, y: 0, width: W, height: H });
      else await window.svg2pdf.svg2pdf(el, doc, { x: 0, y: 0, width: W, height: H });
      onProgress && onProgress(i + 1, pages.length);
    }
    return doc.output('blob');
  } finally { holder.remove(); }
}

/* Webschriften für Bilder: Ein SVG, das als Bild gezeichnet wird, darf keine externen Schriften laden.

   Ohne Internet bzw. wo fetch gesperrt ist, wird eine Systemschrift verwendet. */
const FONT_CSS_URL = 'https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Patrick+Hand&family=Quicksand:wght@400;700&display=swap';
const FontEmbed = {
  promise: null,
  get() {
    if (this.promise) return this.promise;
    this.promise = (async () => {
      try {
        const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
        const css = await (await fetch(FONT_CSS_URL, { signal: ctrl.signal })).text();
        clearTimeout(t);
        const blocks = css.split('/* ').filter(b => b.startsWith('latin */')).map(b => b.slice(9));
        const out = [];
        for (const b of blocks) {
          const m = b.match(/url\((https:[^)]+)\)/); if (!m) continue;
          const blob = await (await fetch(m[1])).blob();
          const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          out.push(b.replace(m[1], data).replace(/unicode-range:[^;]+;/, ''));
        }
        return out.join('\n');
      } catch (_) { return ''; }
    })();
    return this.promise;

  dpi = Math.min(dpi, Math.sqrt(16e6 / (W * H)) * 72);

  return svgToJpeg(svg, W, H, dpi, type);

      g.drawImage(img, 0, 0, c.width, c.height);

/** Minimaler PDF-Schreiber: eine JPEG-Seite pro Blatt in exakter Papiergröße. */
function jpegPdf(imgs) {
  const enc = new TextEncoder(), chunks = [], offsets = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const obj = (n, body) => { offsets[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n = imgs.length, kids = [];
  for (let i = 0; i < n; i++) kids.push(`${3 + i * 3} 0 R`);
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`));
  imgs.forEach((im, i) => {
    const pg = 3 + i * 3, content = pg + 1, image = pg + 2;
    obj(pg, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${im.W} ${im.H}] /Resources << /XObject << /Im${i} ${image} 0 R >> >> /Contents ${content} 0 R >>`));
    const stream = `q ${im.W} 0 0 ${im.H} 0 0 cm /Im${i} Do Q`;
    obj(content, () => push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`));
    const bin = atob(im.data.split(',')[1]), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    obj(image, () => { push(`<< /Type /XObject /Subtype /Image /Width ${im.pw} /Height ${im.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); push(bytes); push('\nendstream'); });
  });
  const total = 3 + n * 3, xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

const inClaude = () => !!(window.claude && typeof window.claude.use === 'function');

/** Datei speichern: in claude.ai über die Download-Freigabe, sonst als normaler Browser-Download. */
async function saveFile(filename, blob) {
  if (inClaude()) {
    const dl = await claude.use('downloads');
    if (!dl) throw { code: 'unavailable' };
    await dl.save({ filename, data: blob });
    return true;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}

/** Drucken im Browser (außerhalb von claude.ai): Seiten in Originalgröße, @page passend gesetzt. */
function printPages(p, months) {
  const pages = pagesFor(p, months);
  const first = pages[0]({ pdf: false });
  const [wmm, hmm] = pageSizeMm(p.paper, p.orientation || 'LANDSCAPE');
  let area = document.getElementById('print-area');
  if (!area) { area = document.createElement('div'); area.id = 'print-area'; document.body.appendChild(area); }
  area.innerHTML = `<style>@page{size:${wmm}mm ${hmm}mm;margin:0}</style>` +
    pages.map((fn, i) => { const { svg } = i === 0 ? first : fn({ pdf: false }); return `<div class="print-page" style="width:${wmm}mm;height:${hmm}mm">${svg}</div>`; }).join('');
  setTimeout(() => window.print(), 300);
}

/** Jede Seite als eigene JPG-Datei speichern (Spez.-Erweiterung: Bildexport). */
async function saveJpgs(p, months, onProgress) {
  await Store.preload(p);
  const list = p.type === 'YEAR_PLANNER' ? [null] : months.slice().sort((a, b) => a - b);
  const base = pdfBase(p);
  let saved = 0;
  for (let i = 0; i < list.length; i++) {
    const m = list[i];
    const { svg, W, H } = m === null ? plannerSVG(p) : monthPageSVG(p, m);
    onProgress && onProgress(i + 1, list.length);
    const { blob } = await renderPageImage(svg, W, H, 300);
    const mn = ascii(cap(loc(calLang(p)).months[(m || 1) - 1]));
    const name = m === null ? `${base}_${t('file:Jahresplaner')}.jpg` : `${base}_${pad2(m)}_${mn}.jpg`;
    await saveFile(name, blob);
    saved++;
  }
  return saved;
}

const ascii = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ß/g, 'ss');
function pdfBase(p) {
  const safe = ascii(p.name).replace(/[^A-Za-z0-9 _-]/g, '').trim().replace(/\s+/g, '_') || t('file:Kalender');

}

/* ---------- Zoom (Pinch, Mausrad, Ziehen, Doppeltippen) ---------- */
function attachZoom(viewport, opts = {}) {
  const inner = viewport.firstElementChild;
  let s = 1, tx = 0, ty = 0, pts = new Map(), start = null, moved = false;
  const max = opts.max || 6;
  const apply = () => {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const mx = vw * (s - 1) / 2, my = vh * (s - 1) / 2;
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
    inner.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    viewport.classList.toggle('zoomed', s > 1.01);
  };
  const zoomAt = (ns, cx, cy) => {
    ns = Math.max(1, Math.min(max, ns));
    const r = viewport.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
    tx = px - (px - tx) * ns / s; ty = py - (py - ty) * ns / s; s = ns;
    if (s === 1) { tx = 0; ty = 0; }
    apply();
  };
  viewport.addEventListener('wheel', e => { e.preventDefault(); zoomAt(s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  viewport.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; start = { d: Math.hypot(a.x - b.x, a.y - b.y), s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; }
  });
  viewport.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && start) {
      const [a, b] = [...pts.values()];
      zoomAt(start.s * Math.hypot(a.x - b.x, a.y - b.y) / start.d, (a.x + b.x) / 2, (a.y + b.y) / 2); moved = true;
    } else if (pts.size === 1 && s > 1) {
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      if (Math.abs(dx) + Math.abs(dy) > 0.5) { tx += dx; ty += dy; apply(); if (Math.abs(dx) + Math.abs(dy) > 2) moved = true; }
    }
  });

  viewport.addEventListener('pointerup', up); viewport.addEventListener('pointercancel', up);
  viewport.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  viewport.addEventListener('dblclick', e => { e.preventDefault(); zoomAt(s > 1.2 ? 1 : 3, e.clientX, e.clientY); });
  viewport.style.touchAction = 'none';
  apply();
  return {
    zoomIn: () => { const r = viewport.getBoundingClientRect(); zoomAt(s * 1.5, r.left + r.width / 2, r.top + r.height / 2); },
    zoomOut: () => { const r = viewport.getBoundingClientRect(); zoomAt(s / 1.5, r.left + r.width / 2, r.top + r.height / 2); },
    reset: () => { s = 1; tx = 0; ty = 0; apply(); },
  };
}

const yearPicker = y => `<div class="year"><button class="icon-btn tonal" data-act="year-" aria-label="${t('Jahr verringern')}" ${y <= YEAR_MIN ? 'disabled' : ''}>${icon('minus')}</button>

const clampYear = y => Math.max(YEAR_MIN, Math.min(YEAR_MAX, Math.round(Number(y) || new Date().getFullYear())));
const checkRow = (act, label, on) => `<label class="check"><input type="checkbox" data-in="${act}" ${on ? 'checked' : ''}><span>${esc(label)}</span></label>`;

/** Bildauswahl über alle Monate (Spez. 7.2): Auswahl mit „Übernehmen“ bestätigen. */
function pickDrawing(title, month, current, onPick) {
  let m = month, sel = current;
  const body = () => `<div class="hint">${t('Hinweis: einfache Platzhaltergrafiken – die finalen Illustrationen werden separat geliefert.')}</div>
    <div class="grid-thumbs">${Catalog.drawingsFor(m).map(tp => `<button class="tcard ${tp.id === sel ? 'on' : ''}" data-act="pick" data-v="${tp.id}">${thumb(templateDrawingSVG(tp.id, 0, 0, 100, 100))}<span>${esc(drawingName(tp))}</span></button>`).join('')}</div>`;
  const md = UI.modal(`<div class="modal-head"><button class="icon-btn" data-act="modal-close" aria-label="${t('Schließen')}">${icon('close')}</button><h2>${esc(title)}</h2><button class="btn primary" data-act="apply">${t('Übernehmen')}</button></div>
    ${monthTabs(m)}<div class="modal-body" id="pick-body">${body()}</div>`,
    {
      tab: el => { m = +el.dataset.v; $$('.tab', md.el).forEach(t => t.classList.toggle('on', t === el)); $('#pick-body', md.el).innerHTML = body(); },
      pick: el => { sel = el.dataset.v; $$('.tcard', md.el).forEach(t => t.classList.toggle('on', t === el)); },
      apply: () => { if (sel) { UI.closeModal(); onPick(sel); } },
    }, { full: true, noFocus: true });
}

/** Ereignis-Dialog (Spez. 11.2). */
function editEvent(p, ev, onDone) {
  const e = Object.assign({ id: null, title: '', category: 'BIRTHDAY', icon: null, note: '', yearly: true, asImage: false }, ev);
  e.icon = e.icon || (CATEGORIES.find(c => c[0] === e.category) || CATEGORIES[0])[2];
  const html = () => `<h2>${e.id ? t('Ereignis bearbeiten') : t('Ereignis hinzufügen')} – ${esc(dayTitle(e.date))}</h2>
    <label class="field"><span>${t('Bezeichnung')}</span><input id="ev-title" maxlength="60" value="${esc(e.title)}" placeholder="${t('z. B. Dominiks Geburtstag')}"></label>
    <label class="field"><span>${t('Art')}</span><select id="ev-cat">${CATEGORIES.map(([k, l]) => `<option value="${k}" ${k === e.category ? 'selected' : ''}>${esc(t(l))}</option>`).join('')}</select></label>
    <div class="label">${t('Symbol')}</div><div class="icons">${EVENT_ICONS.map(n => `<button class="icon-choice ${n === e.icon ? 'on' : ''}" data-act="ev-icon" data-v="${n}" aria-label="${esc((MOTIF_L[LANG] || {})[n] || MOTIFS[n].l)}">${motifIcon(n, 30)}</button>`).join('')}</div>
    <label class="field"><span>${t('Kurzer Text (optional)')}</span><input id="ev-note" maxlength="120" value="${esc(e.note || '')}"></label>
    <label class="check"><input type="checkbox" id="ev-yearly" ${e.yearly ? 'checked' : ''}><span>${t('Jedes Jahr wiederholen')}</span></label>
    <label class="check"><input type="checkbox" id="ev-img" ${e.asImage ? 'checked' : ''}><span>${t('Symbol statt Tagesbild zeigen')}</span></label>
    <div class="row end">${e.id ? `<button class="btn text danger-text" data-act="ev-del">${t('Löschen')}</button><span class="grow"></span>` : ''}<button class="btn text" data-act="modal-close">${t('Abbrechen')}</button><button class="btn primary" data-act="ev-save">${t('Speichern')}</button></div>`;
  const read = () => { e.title = $('#ev-title').value; e.note = $('#ev-note').value; e.yearly = $('#ev-yearly').checked; e.asImage = $('#ev-img').checked; e.category = $('#ev-cat').value; };
  const md = UI.modal(html(), {
    'ev-icon': el => { read(); e.icon = el.dataset.v; $$('.icon-choice', md.el).forEach(b => b.classList.toggle('on', b === el)); },
    'ev-save': () => {
      read(); if (!e.title.trim()) { $('#ev-title').focus(); return; }
      const clean = { id: e.id || uid(), date: e.date, title: e.title.trim(), category: e.category, icon: e.icon, note: e.note.trim(), yearly: e.yearly, asImage: e.asImage };
      const i = p.events.findIndex(x => x.id === clean.id);
      if (i >= 0) p.events[i] = clean; else p.events.push(clean);
      Store.saveProject(p); UI.closeModal(); onDone && onDone();
    },
    'ev-del': () => { p.events = p.events.filter(x => x.id !== e.id); Store.saveProject(p); UI.closeModal(); onDone && onDone(); },
  });
  $('#ev-cat', md.el).addEventListener('change', ev2 => {
    read(); const c = CATEGORIES.find(x => x[0] === ev2.target.value); e.icon = c[2];
    if (c[0] === 'BIRTHDAY' || c[0] === 'NAME_DAY') $('#ev-yearly').checked = true;
    $$('.icon-choice', md.el).forEach(b => b.classList.toggle('on', b.dataset.v === e.icon));
  });
}

function titleOverlay(text, w, h) {
  const ts = h * 0.26, tw = Measure.width(text, ts, fontFamily('fredoka'), true);
  return `<rect x="${w / 2 - tw / 2 - ts * 0.5}" y="${h / 2 - ts * 0.85}" width="${tw + ts}" height="${ts * 1.6}" rx="${ts * 0.3}" fill="#fff" stroke="#000" stroke-width="${ts * 0.06}"/><text x="${w / 2}" y="${h / 2 + ts * 0.3}" font-family="${fontFamily('fredoka')}" font-weight="bold" font-size="${ts}" text-anchor="middle">${esc(text)}</text>`;
}

Screens.settings = {
  title: 'Einstellungen',
  render: () => `<div class="form">
    <div class="label">${t('Sprache')}</div>${langChips('lang', LANG)}
    <label class="field"><span>${t('Standard-Bundesland')}</span>${stateSelect(Settings.data.state)}</label>

    <div class="label">${t('Datensicherung')}</div>
    <p class="muted">${t('Alle Kalender, Zeichnungen und Bilder als eine Datei sichern bzw. wiederherstellen (z. B. zum Umzug auf ein anderes Gerät).')}</p>
    <div class="row"><button class="btn tonal" data-act="backup">${icon('backup', 18)} ${t('Sicherung speichern')}</button><label class="btn tonal">${icon('upload', 18)} ${t('Sicherung laden')}<input type="file" accept=".json,application/json" data-in="restore" hidden></label></div>
    <div class="label">${t('Über ColorDays')}</div>
    <p class="muted">Version ${VERSION} (Web) · ${Store.mode === 'db' ? t('Speicherung privat im Claude-Konto') : Store.mode === 'local' ? t('Speicherung in diesem Browser') : t('ohne Speicherung')} · Keine Werbung, kein Tracking.</p></div>`,
  on: {
    state: el => { Settings.data.state = el.value || null; Settings.save(); },
    hol: el => { Settings.data.holidays = el.checked; Settings.save(); },
    lang: el => { setLang(el.dataset.v); Settings.data.lang = LANG; Settings.save(); UI.render(); },
    backup: async () => {
      UI.busy(true, t('Sicherung wird erstellt …'));
      try {
        const projects = Store.list(), drawings = {}, images = {};
        for (const p of projects) {
          await Store.preload(p);
          for (const d of Object.values(p.days)) if (d.drawingId) drawings[d.drawingId] = Store.drawings.get(d.drawingId);
          for (const m of Object.values(p.months)) if (m.customHeader) drawings[m.customHeader] = Store.drawings.get(m.customHeader);
          if (p.options.headerImage) images[p.options.headerImage] = Store.images.get(p.options.headerImage);
        }
        for (const d of Object.values(drawings)) if (d) for (const id of drawingImageIds(d)) images[id] = Store.images.get(id);
        const data = JSON.stringify({ app: 'ColorDays', version: VERSION, created: new Date().toISOString(), settings: Settings.data, projects, drawings, images });
        await saveFile(`ColorDays_Sicherung_${new Date().toISOString().slice(0, 10)}.json`, new Blob([data], { type: 'application/json' }));
      } catch (e) { if (!e || e.code !== 'declined') UI.toast('Sicherung konnte nicht gespeichert werden.'); }
      finally { UI.busy(false); }
    },
    restore: async el => {
      const file = el.files[0]; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (data.app !== 'ColorDays' || !Array.isArray(data.projects)) throw new Error('format');
        UI.confirm(t('Sicherung laden?'), t('{0} Kalender werden hinzugefügt. Vorhandene Kalender bleiben erhalten.', data.projects.length), t('Laden'), async () => {
          UI.busy(true, t('Wird geladen …'));
          for (const [id, url] of Object.entries(data.images || {})) if (url) { Store.images.set(id, url); await Store._write('i_' + id, { kind: 'image', i: url }); }
          for (const d of Object.values(data.drawings || {})) if (d) await Store.saveDrawing(d, true);
          for (const p of data.projects) { if (Store.get(p.id)) p.id = uid(); await Store.saveProject(p, true); }
          UI.busy(false); UI.toast('Sicherung geladen.');
        });
      } catch (_) { UI.toast('Die Datei ist keine gültige ColorDays-Sicherung.'); }
      el.value = '';
    },
  },
};

/** Tagespanel (Spez. 7.1). */
function dayPanel(p, date) {
  const pr = Store.get(p.id), ds = pr.days[date] || {}, evs = eventsForYear(pr.events, pr.year, pr.options.feb29)[date] || [];
  const setDay = patch => { pr.days[date] = Object.assign({}, pr.days[date] || {}, patch); Store.saveProject(pr); };
  const dropCustom = async () => { const old = (pr.days[date] || {}).drawingId; if (old) await Store.deleteDrawing(old); };
  const after = () => { UI.closeAll(); UI.refresh(); };
  UI.modal(`<h2>${esc(dayTitle(date))}</h2><div class="menu">
    <button data-act="d-change">${icon('image')} ${t('Bild ändern')}</button>
    <button data-act="d-change">${icon('layers')} ${t('Vorlage auswählen')}</button>
    <button data-act="d-design">${icon('brush')} ${ds.drawingId ? t('Eigenes Bild bearbeiten') : t('Selbst gestalten')}</button>
    <button data-act="d-remove">${icon('trash')} ${t('Bild entfernen')}</button>
    <button data-act="d-event">${icon('event')} ${t('Ereignis hinzufügen')}</button>
    <button data-act="d-restore">${icon('restore')} ${t('Original wiederherstellen')}</button>
    ${evs.map(e => `<button data-act="d-ev" data-id="${e.id}">${motifIcon(e.icon || 'STAR', 22)} ${esc(e.title)}${e.yearly ? ' ↻' : ''}</button>`).join('')}</div>`, {
    'd-change': () => pickDrawing(dayTitle(date), parseIso(date).m, ds.templateId || Catalog.defaultDrawing(date), async id => { await dropCustom(); setDay({ templateId: id, drawingId: null, removed: false }); after(); }),
    'd-remove': async () => { await dropCustom(); setDay({ removed: true, drawingId: null }); after(); },
    'd-design': async () => {
      let id = ds.drawingId;
      if (!id) {
        const start = ds.removed ? [] : [{ id: uid(), type: 'STICKER', x: 100, y: 100, w: 800, h: 800, rot: 0, props: { sticker: ds.templateId || Catalog.defaultDrawing(date) } }];
        const d = { id: uid(), width: 1000, height: 1000, mode: 'COLORING', bg: '#ffffff', elements: start };
        await Store.saveDrawing(d, true); id = d.id; setDay({ drawingId: id, removed: false }); Store.saveProject(pr, true);
      }
      UI.closeAll(); UI.go('editor', { docId: id, projectId: pr.id });
    },
    'd-event': () => editEvent(pr, { date }, after),
    'd-ev': el => editEvent(pr, pr.events.find(e => e.id === el.dataset.id), after),
    'd-restore': () => {
      const run = async () => { await dropCustom(); delete pr.days[date]; Store.saveProject(pr); after(); };
      if (ds.drawingId) UI.confirm(t('Original wiederherstellen'), t('Dein selbst gestaltetes Bild für diesen Tag geht dabei verloren.'), t('Wiederherstellen'), run, true); else run();
    },
  }, { sheet: true, noFocus: true });
}

/** Jahreswechsel (Spez. 4.1): Tage/einmalige Ereignisse verschieben oder löschen, jährliche bleiben. */
async function applyYear(pr, y, move) {
  const days = {}, drop = [];
  for (const [k, v] of Object.entries(pr.days)) {
    const nk = move ? moveToYear(k, y) : null;
    if (nk) days[nk] = v; else if (v.drawingId) drop.push(v.drawingId);
  }
  pr.days = days;
  pr.events = pr.events.flatMap(e => {
    if (e.yearly) return [e];
    if (!move) return [];
    return [{ ...e, date: moveToYear(e.date, y) || iso(y, 2, 28) }];
  });
  pr.year = y; Store.saveProject(pr, true);
  for (const id of drop) await Store.deleteDrawing(id);
}

        else UI.toast('Teilen wird von diesem Browser nicht unterstützt.');

  },

function zoomViewer(p, index) {

'use strict';
/* ColorDays Web – Zeicheneditor (Spez. 8–10). Objekte statt Rasterbild; Autosave; Undo/Redo. */

const TOOLS = [['SELECT','Auswahl'],['PENCIL','Stift'],['ERASER','Radierer'],['LINE','Linie'],['ARROW','Pfeil'],['CIRCLE','Kreis'],['ELLIPSE','Ellipse'],['SQUARE','Quadrat'],['RECT','Rechteck'],['TRIANGLE','Dreieck'],['STAR','Stern'],['HEART','Herz'],['TEXT','Text'],['FILL','Füllen']];
const SHAPE_TOOLS = ['CIRCLE','ELLIPSE','SQUARE','RECT','TRIANGLE','STAR','HEART'];
const FILLABLE = ['RECT','ELLIPSE','TRIANGLE','STAR','HEART'];
const TYPE_LABEL = { PATH: 'Stift', ERASER: 'Radierer', LINE: 'Linie', ARROW: 'Pfeil', RECT: 'Rechteck', ELLIPSE: 'Ellipse', TRIANGLE: 'Dreieck', STAR: 'Stern', HEART: 'Herz', TEXT: 'Text', IMAGE: 'Bild', STICKER: 'Sticker' };
const toolGlyph = t => {
  const g = { SELECT: ICON.select, PENCIL: ICON.pencil, ERASER: ICON.eraser, TEXT: ICON.text, FILL: ICON.fill,
    LINE: '<path d="M5 19L19 5"/>', ARROW: '<path d="M5 19L19 5M19 5h-8M19 5v8"/>', CIRCLE: '<circle cx="12" cy="12" r="8"/>', ELLIPSE: '<ellipse cx="12" cy="12" rx="10" ry="6"/>',
    SQUARE: '<rect x="5" y="5" width="14" height="14"/>', RECT: '<rect x="2" y="7" width="20" height="10"/>', TRIANGLE: '<path d="M12 4l9 16H3z"/>',
    STAR: '<path d="M12 3l2.6 6 6.4.4-5 4.1 1.6 6.5L12 16.6 6.4 20l1.6-6.5-5-4.1 6.4-.4z"/>', HEART: '<path d="M12 20s-8-5-8-11a4 4 0 018-1 4 4 0 018 1c0 6-8 11-8 11z"/>' }[t];
  return `<svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${g}</svg>`;
};

const Ed = {
  doc: null, tool: 'PENCIL', color: '#000000', sw: 10, eraser: 48, fillNew: false, sel: null, live: null, undo: [], redo: [],
  drag: null, svg: null,
  refreshAll() { refreshEditor(); },
  selected() { return this.doc && this.doc.elements.find(e => e.id === this.sel) || null; },
  commit(elements) {
    this.undo.push(this.doc.elements); if (this.undo.length > 60) this.undo.shift();
    this.redo = []; this.doc.elements = elements; this.persist(); this.refreshAll();
  },
  persist() { Store.saveDrawing(this.doc); },
  add(el, select) { this.commit([...this.doc.elements, el]); if (select) { this.sel = el.id; this.refreshAll(); } },
  replace(el) { this.commit(this.doc.elements.map(e => e.id === el.id ? el : e)); },

/* Geometrie mit Rotation */
const toLocal = (el, x, y) => { const a = -(el.rot || 0) * Math.PI / 180, dx = x - (el.x + el.w / 2), dy = y - (el.y + el.h / 2); return [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a)]; };
const toWorld = (el, lx, ly) => { const a = (el.rot || 0) * Math.PI / 180; return [el.x + el.w / 2 + lx * Math.cos(a) - ly * Math.sin(a), el.y + el.h / 2 + lx * Math.sin(a) + ly * Math.cos(a)]; };
const hitEl = (el, x, y, tol) => { const [lx, ly] = toLocal(el, x, y); return Math.abs(lx) <= el.w / 2 + tol && Math.abs(ly) <= el.h / 2 + tol; };
const topHit = (x, y, tol) => [...Ed.doc.elements].reverse().find(e => e.type !== 'ERASER' && hitEl(e, x, y, tol));
const textHeight = (props, w) => Measure.wrap(props.text || '', props.size, fontFamily(props.font), props.bold, w).length * props.size * 1.18 + props.size * 0.2;

Screens.editor = {
  title: 'Zeichnen',
  async load(p) {
    if (!Ed.doc || Ed.doc.id !== p.docId) {
      const d = await Store.getDrawing(p.docId);
      Object.assign(Ed, { doc: d ? structuredClone(d) : null, sel: null, live: null, undo: [], redo: [], tool: 'PENCIL' });
      if (Ed.doc) await Store.ensureImages(drawingImageIds(Ed.doc));
    }
  },
  actions: () => `<button class="icon-btn" data-act="undo" aria-label="${t('Rückgängig')}" ${Ed.undo.length ? '' : 'disabled'}>${icon('undo')}</button><button class="icon-btn" data-act="redo" aria-label="${t('Wiederholen')}" ${Ed.redo.length ? '' : 'disabled'}>${icon('redo')}</button><button class="icon-btn" data-act="layers" aria-label="${t('Ebenen')}">${icon('layers')}</button>`,
  render: () => {
    const d = Ed.doc;
    if (!d) return `<p class="muted">${t('Diese Zeichnung wurde nicht gefunden.')}</p>`;

      <div class="ed-stage"><svg id="ed" viewBox="0 0 ${d.width} ${d.height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${t('Zeichenfläche')}"><g id="ed-content"></g><g id="ed-overlay"></g></svg></div>
      <div id="ed-selbar" class="selbar"></div>
      <div class="ed-tools">${TOOLS.map(([tl, l]) => `<button class="tool ${Ed.tool === tl ? 'on' : ''}" data-act="tool" data-v="${tl}">${toolGlyph(tl)}<span>${t(l)}</span></button>`).join('')}
        <label class="tool">${icon('image')}<span>${t('Bild')}</span><input type="file" accept="image/png,image/jpeg,image/webp" data-in="img" hidden></label>
        <button class="tool" data-act="sticker">${icon('sticker')}<span>${t('Sticker')}</span></button></div>
      <div id="ed-colors">${swatches('color', PALETTE, Ed.color)}</div>
      <div class="ed-size row"><span id="ed-size-l">${Ed.tool === 'ERASER' ? t('Radierer') : t('Pinselstärke')}</span>
        <input type="range" id="ed-size" min="${Ed.tool === 'ERASER' ? 10 : 2}" max="${Ed.tool === 'ERASER' ? 160 : 60}" value="${Ed.tool === 'ERASER' ? Ed.eraser : Ed.sw}" data-in="size" aria-label="${t('Stärke')}">
        ${SHAPE_TOOLS.includes(Ed.tool) ? `<button class="chip ${Ed.fillNew ? 'on' : ''}" data-act="fillnew">${t('Füllen')}</button>` : ''}</div></div>`;
  },
  mount() {
    if (!Ed.doc) return;

    const svg = Ed.svg;
    svg.addEventListener('pointerdown', onDown);
    svg.addEventListener('pointermove', onMove);
    svg.addEventListener('pointerup', onUp);
    svg.addEventListener('pointercancel', onUp);
  },
  on: {
    undo: () => { const prev = Ed.undo.pop(); if (!prev) return; Ed.redo.push(Ed.doc.elements); Ed.doc.elements = prev; Ed.sel = null; Ed.persist(); refreshEditor(); },
    redo: () => { const next = Ed.redo.pop(); if (!next) return; Ed.undo.push(Ed.doc.elements); Ed.doc.elements = next; Ed.sel = null; Ed.persist(); refreshEditor(); },
    mode: el => { Ed.doc.mode = el.dataset.v; Ed.persist(); UI.refresh(); },
    tool: el => { Ed.tool = el.dataset.v; if (Ed.tool !== 'SELECT') Ed.sel = null; UI.refresh(); },
    color: el => { Ed.color = el.dataset.v; if (Ed.doc.mode === 'COLORING') UI.toast('Im Malvorlage-Modus erscheinen alle Linien schwarz. Wechsle zu „Farbe“, um Farben zu sehen.'); $('#ed-colors').innerHTML = swatches('color', PALETTE, Ed.color); },
    'size:input': el => { if (Ed.tool === 'ERASER') Ed.eraser = +el.value; else Ed.sw = +el.value; },
    fillnew: () => { Ed.fillNew = !Ed.fillNew; UI.refresh(); },
    sticker: () => pickDrawing(t('Sticker'), new Date().getMonth() + 1, null, id => {
      const side = Math.min(Ed.doc.width, Ed.doc.height) * 0.4;
      Ed.add({ id: uid(), type: 'STICKER', x: (Ed.doc.width - side) / 2, y: (Ed.doc.height - side) / 2, w: side, h: side, rot: 0, props: { sticker: id } }, true);
      Ed.tool = 'SELECT'; UI.refresh();
    }),
    img: async el => {
      const file = el.files[0]; el.value = ''; if (!file) return;
      try {
        UI.busy(true, t('Bild wird geladen …'));
        const im = await downscaleImage(file), id = await Store.saveImage(im.dataUrl);
        const max = Math.min(Ed.doc.width, Ed.doc.height) * 0.7, s = max / Math.max(im.w, im.h), w = im.w * s, h = im.h * s;
        Ed.add({ id: uid(), type: 'IMAGE', x: (Ed.doc.width - w) / 2, y: (Ed.doc.height - h) / 2, w, h, rot: 0, props: { img: id, iw: im.w, ih: im.h, crop: [0, 0, 1, 1] } }, true);
        Ed.tool = 'SELECT';
      } catch (_) { UI.toast('Das Bild konnte nicht geladen werden.'); }
      finally { UI.busy(false); UI.refresh(); }
    },
    layers: () => layersDialog(),
    's-del': () => { Ed.commit(Ed.doc.elements.filter(e => e.id !== Ed.sel)); Ed.sel = null; refreshEditor(); },
    's-copy': () => { const s = Ed.selected(); if (s) Ed.add({ ...structuredClone(s), id: uid(), x: s.x + 40, y: s.y + 40 }, true); },
    's-front': () => moveLayer(Ed.sel, 1), 's-back': () => moveLayer(Ed.sel, -1),
    's-color': () => { const s = Ed.selected(); if (s) Ed.replace({ ...s, props: { ...s.props, stroke: Ed.color } }); },
    's-fill': () => { const s = Ed.selected(); if (s) Ed.replace({ ...s, props: { ...s.props, fill: Ed.color } }); },
    's-nofill': () => { const s = Ed.selected(); if (s) Ed.replace({ ...s, props: { ...s.props, fill: null } }); },
    's-text': () => { const s = Ed.selected(); if (s) textDialog(s); },
    's-crop': () => { const s = Ed.selected(); if (s) cropDialog(s); },
  },
};

function moveLayer(id, delta) {
  const list = [...Ed.doc.elements], i = list.findIndex(e => e.id === id); if (i < 0) return;
  const j = Math.max(0, Math.min(list.length - 1, i + delta)); if (i === j) return;
  const [el] = list.splice(i, 1); list.splice(j, 0, el); Ed.commit(list);
}

function refreshEditor() {
  if (!Ed.svg) return;
  const d = Ed.doc, live = Ed.live, inDoc = live && d.elements.some(e => e.id === live.id);
  // Ein bewegtes Objekt wird an seiner Ebene gezeigt, ein neues obenauf.
  $('#ed-content').innerHTML = inDoc ? docContentSVG({ ...d, elements: d.elements.map(e => e.id === live.id ? live : e) })
    : docContentSVG(d, { extra: live || null });
  const sel = inDoc ? live : Ed.selected(), ov = $('#ed-overlay');
  const scale = Ed.svg.getScreenCTM() ? Ed.svg.getScreenCTM().a : 1, px = v => v / (scale || 1);
  ov.innerHTML = '';
  if (sel && Ed.tool === 'SELECT') {
    const c = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => toWorld(sel, a * sel.w / 2, b * sel.h / 2));
    const top = toWorld(sel, 0, -sel.h / 2), rot = toWorld(sel, 0, -sel.h / 2 - px(36)), rs = toWorld(sel, sel.w / 2, sel.h / 2);
    ov.innerHTML = `<polygon points="${c.map(p => p.join(',')).join(' ')}" fill="none" stroke="#3D5A80" stroke-width="${px(2)}" stroke-dasharray="${px(8)} ${px(6)}"/>
      <line x1="${top[0]}" y1="${top[1]}" x2="${rot[0]}" y2="${rot[1]}" stroke="#3D5A80" stroke-width="${px(2)}"/>
      <circle cx="${rot[0]}" cy="${rot[1]}" r="${px(12)}" fill="#fff" stroke="#3D5A80" stroke-width="${px(3)}"/>
      <rect x="${rs[0] - px(11)}" y="${rs[1] - px(11)}" width="${px(22)}" height="${px(22)}" fill="#fff" stroke="#3D5A80" stroke-width="${px(3)}"/>`;
  }
  const bar = $('#ed-selbar'), s = Ed.selected();
  bar.innerHTML = s ? [['s-del', 'trash', t('Löschen')], ['s-copy', 'copy', t('Kopieren')], ['s-front', 'front', t('Nach vorn')], ['s-back', 'back2', t('Nach hinten')], ['s-color', 'palette', t('Farbe übernehmen')],
    ...(FILLABLE.includes(s.type) ? [['s-fill', 'fill', t('Füllen')], ['s-nofill', 'close', t('Füllung entfernen')]] : []),
    ...(s.type === 'TEXT' ? [['s-text', 'edit', t('Text bearbeiten')]] : []), ...(s.type === 'IMAGE' ? [['s-crop', 'crop', t('Zuschneiden')]] : [])]
    .map(([a, ic, l]) => `<button class="icon-btn" data-act="${a}" title="${l}" aria-label="${l}">${icon(ic)}</button>`).join('') : '';
  const ub = $('[data-act=undo]'), rb = $('[data-act=redo]');
  if (ub) ub.disabled = !Ed.undo.length; if (rb) rb.disabled = !Ed.redo.length;
}

/* ---------- Gesten ---------- */
function docPt(e) { const p = svgPoint(Ed.svg, e); return [p.x, p.y]; }
function tolDoc(pxv) { const m = Ed.svg.getScreenCTM(); return pxv / (m ? m.a : 1); }

function onDown(e) {
  if (e.button > 0) return;
  Ed.svg.setPointerCapture(e.pointerId);
  const [x, y] = docPt(e);
  Ed.drag = { x0: x, y0: y, sx: e.clientX, sy: e.clientY, moved: false, mode: null, el: null, pts: [x, y] };
  const t = Ed.tool;
  if (t === 'PENCIL' || t === 'ERASER') Ed.drag.mode = 'DRAW';
  else if (t === 'SELECT' || t === 'TEXT' || t === 'FILL') {
    const sel = Ed.selected(), tol = tolDoc(20);
    if (t === 'SELECT' && sel) {
      const rs = toWorld(sel, sel.w / 2, sel.h / 2), ro = toWorld(sel, 0, -sel.h / 2 - tolDoc(36));
      if (Math.hypot(rs[0] - x, rs[1] - y) <= tol * 1.6) { Ed.drag.mode = 'RESIZE'; Ed.drag.el = sel; return; }
      if (Math.hypot(ro[0] - x, ro[1] - y) <= tol * 1.6) { Ed.drag.mode = 'ROTATE'; Ed.drag.el = sel; return; }
    }
    const hit = topHit(x, y, tol);
    if (hit && t === 'SELECT') { Ed.drag.mode = 'MOVE'; Ed.drag.el = hit; Ed.sel = hit.id; refreshEditor(); }
  } else Ed.drag.mode = 'SHAPE';
}

function onMove(e) {
  const d = Ed.drag; if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 4 && d.mode !== 'DRAW') return;
  d.moved = true;
  const [x, y] = docPt(e);
  switch (d.mode) {
    case 'DRAW': {
      const n = d.pts.length;
      if (Math.hypot(x - d.pts[n - 2], y - d.pts[n - 1]) >= 2) d.pts.push(x, y);
      Ed.live = strokeEl(d.pts); break;
    }
    case 'SHAPE': Ed.live = shapeEl(d.x0, d.y0, x, y); break;
    case 'MOVE': Ed.live = { ...d.el, x: d.el.x + x - d.x0, y: d.el.y + y - d.y0 }; break;
    case 'RESIZE': {
      const el = d.el, [lx, ly] = toLocal(el, x, y);
      let w = Math.max(Math.abs(lx) * 2, 16), h = Math.max(Math.abs(ly) * 2, 16);
      if (el.type === 'TEXT') h = textHeight(el.props, w);
      else if (el.type === 'IMAGE' || el.type === 'STICKER') { h = w * el.h / el.w; }
      Ed.live = { ...el, x: el.x + el.w / 2 - w / 2, y: el.y + el.h / 2 - h / 2, w, h }; break;
    }
    case 'ROTATE': {
      const el = d.el; let a = Math.atan2(y - (el.y + el.h / 2), x - (el.x + el.w / 2)) * 180 / Math.PI + 90;
      for (const snap of [-90, 0, 90, 180, 270, 360]) if (Math.abs(a - snap) < 4) a = snap;
      Ed.live = { ...el, rot: ((a % 360) + 360) % 360 }; break;
    }
    default: return;
  }
  refreshEditor();
}

function onUp(e) {
  const d = Ed.drag; Ed.drag = null; if (!d) return;
  const [x, y] = docPt(e);
  if (!d.moved) { // Tippen
    Ed.live = null;
    const tool = Ed.tool, tol = tolDoc(20);
    if (tool === 'TEXT') { const hit = [...Ed.doc.elements].reverse().find(el => el.type === 'TEXT' && hitEl(el, x, y, tol)); return textDialog(hit || null, x, y); }
    if (tool === 'FILL') {
      const hit = topHit(x, y, tol);
      if (!hit || !FILLABLE.includes(hit.type)) return UI.toast('Füllen funktioniert bei Formen (Kreis, Rechteck, Dreieck, Stern, Herz).');
      return Ed.replace({ ...hit, props: { ...hit.props, fill: Ed.color } });
    }
    if (tool === 'PENCIL' || tool === 'ERASER') return Ed.add(strokeEl([x, y]), false);
    Ed.sel = (topHit(x, y, tol) || {}).id || null; refreshEditor(); return;
  }
  const live = Ed.live; Ed.live = null;
  if (!live) return refreshEditor();
  if (d.mode === 'DRAW') Ed.add(live, false);
  else if (d.mode === 'SHAPE') { if (live.w >= 16 || live.h >= 16) { Ed.add(live, true); Ed.tool = 'SELECT'; UI.refresh(); } else refreshEditor(); }
  else Ed.replace(live);
}

function strokeEl(pts) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let i = 0; i < pts.length; i += 2) { minX = Math.min(minX, pts[i]); maxX = Math.max(maxX, pts[i]); minY = Math.min(minY, pts[i + 1]); maxY = Math.max(maxY, pts[i + 1]); }
  const w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1), eraser = Ed.tool === 'ERASER';
  const norm = []; for (let i = 0; i < pts.length; i += 2) norm.push(+((pts[i] - minX) / w).toFixed(4), +((pts[i + 1] - minY) / h).toFixed(4));
  if (pts.length === 2) return { id: uid(), type: eraser ? 'ERASER' : 'PATH', x: pts[0] - 0.5, y: pts[1] - 0.5, w: 1, h: 1, rot: 0, props: { stroke: Ed.color, sw: eraser ? Ed.eraser : Ed.sw, pts: [0.5, 0.5] } };
  return { id: (Ed.live && Ed.live.id) || uid(), type: eraser ? 'ERASER' : 'PATH', x: minX, y: minY, w, h, rot: 0, props: { stroke: Ed.color, sw: eraser ? Ed.eraser : Ed.sw, pts: norm } };
}
function shapeEl(x0, y0, x, y) {
  let dx = x - x0, dy = y - y0;
  if (Ed.tool === 'CIRCLE' || Ed.tool === 'SQUARE') { const s = Math.max(Math.abs(dx), Math.abs(dy)); dx = dx < 0 ? -s : s; dy = dy < 0 ? -s : s; }
  const l = Math.min(x0, x0 + dx), t = Math.min(y0, y0 + dy), w = Math.max(Math.abs(dx), 1), h = Math.max(Math.abs(dy), 1);
  const type = { LINE: 'LINE', ARROW: 'ARROW', CIRCLE: 'ELLIPSE', ELLIPSE: 'ELLIPSE', SQUARE: 'RECT', RECT: 'RECT', TRIANGLE: 'TRIANGLE', STAR: 'STAR', HEART: 'HEART' }[Ed.tool];
  const pts = (type === 'LINE' || type === 'ARROW') ? [(x0 - l) / w, (y0 - t) / h, (x0 + dx - l) / w, (y0 + dy - t) / h] : undefined;
  return { id: (Ed.live && Ed.live.id) || uid(), type, x: l, y: t, w, h, rot: 0,
    props: { stroke: Ed.color, sw: Ed.sw, fill: Ed.fillNew && FILLABLE.includes(type) ? Ed.color : null, pts } };
}

/* ---------- Dialoge ---------- */
function textDialog(existing, x, y) {
  const p0 = existing ? existing.props : { text: '', font: 'fredoka', size: 110, bold: false, align: 'CENTER' };
  const st = { font: p0.font, size: p0.size, bold: p0.bold, align: p0.align };
  const md = UI.modal(`<h2>${existing ? t('Text bearbeiten') : t('Text hinzufügen')}</h2>
    <label class="field"><span>${t('Text')}</span><textarea id="tx" rows="2" maxlength="120" placeholder="${t('z. B. Alles Gute!')}">${esc(p0.text)}</textarea></label>
    <div class="label">${t('Schriftart')}</div><div class="chips" id="tx-fonts">${FONTS.map(([id, l, f]) => `<button class="chip ${id === st.font ? 'on' : ''}" style="font-family:'${f}'" data-act="tf" data-v="${id}">${l}</button>`).join('')}</div>
    <div class="label">${t('Schriftgröße')}: <span id="tx-sz">${st.size}</span></div><input type="range" id="tx-size" min="30" max="320" value="${st.size}">
    <label class="check"><input type="checkbox" id="tx-bold" ${st.bold ? 'checked' : ''}><span>${t('Fett')}</span></label>
    <div class="chips">${[['LEFT', t('Links')], ['CENTER', t('Mitte')], ['RIGHT', t('Rechts')]].map(([v, l]) => `<button class="chip ${v === st.align ? 'on' : ''}" data-act="ta" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="row end"><button class="btn text" data-act="modal-close">${t('Abbrechen')}</button><button class="btn primary" data-act="ok">${t('Speichern')}</button></div>`, {
    tf: el => { st.font = el.dataset.v; $$('[data-act=tf]', md.el).forEach(b => b.classList.toggle('on', b === el)); },
    ta: el => { st.align = el.dataset.v; $$('[data-act=ta]', md.el).forEach(b => b.classList.toggle('on', b === el)); },
    ok: () => {
      const text = $('#tx').value; if (!text.trim()) return;
      st.size = +$('#tx-size').value; st.bold = $('#tx-bold').checked;
      const props = { ...(existing ? existing.props : { stroke: Ed.color }), text, font: st.font, size: st.size, bold: st.bold, align: st.align };
      UI.closeModal();
      if (existing) { const h = textHeight(props, existing.w); Ed.replace({ ...existing, props, y: existing.y + existing.h / 2 - h / 2, h }); }
      else {
        const w = Ed.doc.width * 0.8, h = textHeight(props, w);
        Ed.add({ id: uid(), type: 'TEXT', x: x - w / 2, y: y - h / 2, w, h, rot: 0, props }, true);
        Ed.tool = 'SELECT'; UI.refresh();
      }
    },
  });
  $('#tx-size', md.el).addEventListener('input', e => $('#tx-sz', md.el).textContent = e.target.value);
}

function layersDialog() {
  const body = () => {
    const items = Ed.doc.elements.map((e, i) => [e, i]).filter(([e]) => e.type !== 'ERASER').reverse();
    return items.length ? items.map(([e]) => `<div class="layer ${e.id === Ed.sel ? 'on' : ''}"><button class="grow text-left" data-act="l-sel" data-id="${e.id}">${t(TYPE_LABEL[e.type])}${e.type === 'TEXT' ? ' „' + esc(e.props.text.slice(0, 14)) + '“' : ''}</button>
      <button class="icon-btn" data-act="l-up" data-id="${e.id}" aria-label="${t('Nach vorn')}">${icon('up')}</button><button class="icon-btn" data-act="l-down" data-id="${e.id}" aria-label="${t('Nach hinten')}">${icon('down')}</button><button class="icon-btn" data-act="l-del" data-id="${e.id}" aria-label="${t('Löschen')}">${icon('trash')}</button></div>`).join('')
      : `<p class="muted">${t('Noch keine Objekte.')}</p>`;
  };
  const md = UI.modal(`<h2>${t('Ebenen')}</h2><div id="ly">${body()}</div><div class="row end"><button class="btn primary" data-act="modal-close">${t('Schließen')}</button></div>`, {
    'l-sel': el => { Ed.sel = el.dataset.id; Ed.tool = 'SELECT'; UI.closeModal(); UI.refresh(); },
    'l-up': el => { moveLayer(el.dataset.id, 1); $('#ly', md.el).innerHTML = body(); },
    'l-down': el => { moveLayer(el.dataset.id, -1); $('#ly', md.el).innerHTML = body(); },
    'l-del': el => { Ed.commit(Ed.doc.elements.filter(e => e.id !== el.dataset.id)); if (Ed.sel === el.dataset.id) Ed.sel = null; refreshEditor(); $('#ly', md.el).innerHTML = body(); },
  });
}

function cropDialog(el) {
  const c = el.props.crop || [0, 0, 1, 1];
  const r = (id, v) => `<input type="range" id="${id}" min="0" max="100" value="${Math.round(v * 100)}">`;
  UI.modal(`<h2>${t('Zuschneiden')}</h2>
    <div class="label">${t('Links')}</div>${r('cl', c[0])}<div class="label">${t('Rechts')}</div>${r('cr', 1 - c[2])}
    <div class="label">${t('Oben')}</div>${r('ct', c[1])}<div class="label">${t('Unten')}</div>${r('cb', 1 - c[3])}
    <div class="row end"><button class="btn text" data-act="reset">${t('Zurücksetzen')}</button><button class="btn primary" data-act="ok">${t('Übernehmen')}</button></div>`, {
    reset: () => { UI.closeModal(); applyCrop(el, 0, 0, 1, 1); },
    ok: () => {
      const v = id => +$('#' + id).value / 100;
      let l = v('cl'), rr = 1 - v('cr'), t = v('ct'), b = 1 - v('cb');
      if (rr - l < 0.05) rr = l + 0.05; if (b - t < 0.05) b = t + 0.05;
      UI.closeModal(); applyCrop(el, l, t, Math.min(rr, 1), Math.min(b, 1));
    },
  }, { noFocus: true });
}
function applyCrop(el, l, t, r, b) {
  const nh = el.w * ((b - t) * (el.props.ih || 1)) / ((r - l) * (el.props.iw || 1));
  Ed.replace({ ...el, y: el.y + el.h / 2 - nh / 2, h: nh, props: { ...el.props, crop: [l, t, r, b] } });
}

(async () => {
  Catalog.build();
  await Store.init();
  await Settings.load();
  setLang(Settings.data.lang || detectLang());
  try { await document.fonts.ready; } catch (_) {}
  UI.start();
})();
</script>
</body>
</html>
